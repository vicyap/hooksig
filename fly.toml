# fly.toml app configuration file for hooksig
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hooksig'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  PHX_HOST = 'hooksig.fly.dev'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
